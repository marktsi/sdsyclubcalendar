<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Soccer Program Calendar</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    /* San Diego Sockers brand palette */
    --navy: #0d1f5c;
    --navy-light: #1a3070;
    --navy-dark: #07122e;
    --gold: #f0b429;
    --gold-dark: #c8901a;
    --sky: #3a7bc8;
    --sky-dark: #2460a8;
    --tsi-red: #cc1a1a;
    --tsi-red-dark: #a01010;
    /* Mapped to original variable names for compatibility */
    --grass: #1a3070;
    --grass-light: #3a7bc8;
    --grass-dark: #07122e;
    --pitch: #060e1f;
    --white: #f4f6fb;
    --chalk: #dde3f0;
    --amber: #c8901a;
    --red: #cc1a1a;
    --sky-dark: #2460a8;
    --purple: #5b4fcf;
    --teal: #1ab3c8;
    --panel: #0d1a3a;
    --panel-light: #162448;
    --border: #243a6e;
    --text-dim: #7a95cc;
    --shadow: 0 4px 24px rgba(0,0,0,0.6);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Barlow', sans-serif;
    background: var(--pitch);
    color: var(--white);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Pitch lines background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      linear-gradient(rgba(58,123,200,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(58,123,200,0.05) 1px, transparent 1px);
    background-size: 48px 48px;
    pointer-events: none;
    z-index: 0;
  }

  #app { position: relative; z-index: 1; display: flex; flex-direction: column; min-height: 100vh; }

  /* HEADER */
  header {
    background: linear-gradient(135deg, var(--navy-dark) 0%, var(--navy) 60%, #1a2a5e 100%);
    border-bottom: 2px solid var(--grass);
    padding: 0 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 64px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 20px rgba(0,0,0,0.6);
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 12px;
    color: var(--white);
  }
  .logo-sdsy {
    height: 48px;
    width: auto;
    object-fit: contain;
    filter: drop-shadow(0 2px 8px rgba(240,180,41,0.3));
  }
  .logo-divider {
    width: 1px;
    height: 40px;
    background: var(--border);
    flex-shrink: 0;
  }
  .logo-text { display: flex; flex-direction: column; line-height: 1.15; gap: 2px; }
  .logo-main {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 1.05rem;
    font-weight: 900;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .logo-main span { color: var(--gold); }
  .logo-sub-wrap { display: flex; align-items: center; }
  .logo-tsi {
    height: 16px;
    width: auto;
    object-fit: contain;
    filter: brightness(0) invert(0.7);
    opacity: 0.7;
  }
  .logo-icon {
    width: 32px; height: 32px;
    background: var(--grass);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 1rem;
    box-shadow: 0 0 12px rgba(26,122,60,0.6);
  }
  .logo span { color: var(--gold); }

  nav { display: flex; gap: 4px; }
  .nav-btn {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 0.85rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    background: transparent;
    border: 1px solid transparent;
    color: var(--text-dim);
    padding: 6px 14px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .nav-btn:hover { color: var(--white); border-color: var(--border); }
  .nav-btn.active { background: var(--gold); color: var(--navy-dark); border-color: var(--gold-dark); font-weight: 800; }

  /* MAIN LAYOUT */
  main { display: flex; flex: 1; gap: 0; }

  /* SIDEBAR */
  .sidebar {
    width: 260px;
    min-width: 260px;
    background: var(--panel);
    border-right: 1px solid var(--border);
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    overflow-y: auto;
    max-height: calc(100vh - 64px);
    position: sticky;
    top: 64px;
  }

  .sidebar-section h3 {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 0.7rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 10px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 6px;
  }

  /* Age group chips */
  .age-chips { display: flex; flex-direction: column; gap: 6px; }
  .age-chip {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 12px;
    border-radius: 8px;
    cursor: pointer;
    border: 1px solid transparent;
    transition: all 0.2s;
    font-size: 0.85rem;
    font-weight: 500;
  }
  .age-chip:hover { border-color: var(--border); }
  .age-chip.active { border-color: currentColor; }
  .age-chip .chip-left { display: flex; align-items: center; gap: 8px; }
  .age-chip .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .age-chip .chip-badge {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.7rem;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 4px;
    background: rgba(255,255,255,0.1);
  }

  /* Color assignments */
  .c-u67  { color: #f7c844; background: rgba(247,200,68,0.1); }
  .c-u89  { color: #4dc8f0; background: rgba(77,200,240,0.1); }
  .c-u1011 { color: #a78bfa; background: rgba(167,139,250,0.1); }
  .c-u1213 { color: #f97316; background: rgba(249,115,22,0.1); }
  .c-u14  { color: #34d399; background: rgba(52,211,153,0.1); }
  .c-coach { color: #f472b6; background: rgba(244,114,182,0.1); }

  /* Legend */
  .legend { display: flex; flex-direction: column; gap: 6px; }
  .legend-item { display: flex; align-items: center; gap: 8px; font-size: 0.78rem; color: var(--text-dim); }
  .legend-dot { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }

  /* Field list */
  .field-list { display: flex; flex-direction: column; gap: 6px; }
  .field-item {
    background: var(--panel-light);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 0.8rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .field-name { font-weight: 600; }
  .field-permit { color: var(--text-dim); font-size: 0.72rem; }
  .field-edit-btn {
    background: none; border: none; color: var(--text-dim);
    cursor: pointer; font-size: 0.8rem; padding: 2px 4px;
    border-radius: 4px; transition: color 0.2s;
  }
  .field-edit-btn:hover { color: var(--white); }

  /* Mini add btn */
  .add-small {
    background: var(--panel-light);
    border: 1px dashed var(--border);
    color: var(--text-dim);
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 0.78rem;
    cursor: pointer;
    width: 100%;
    text-align: center;
    transition: all 0.2s;
    font-family: 'Barlow', sans-serif;
  }
  .add-small:hover { border-color: var(--grass); color: var(--grass-light); }

  /* CONTENT */
  .content { flex: 1; padding: 24px; overflow-y: auto; }

  /* View: Calendar */
  .calendar-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 20px;
  }
  .month-nav {
    display: flex; align-items: center; gap: 16px;
  }
  .month-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800;
    font-size: 2rem;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .month-title span { color: var(--gold); }
  .nav-arrow {
    background: var(--panel-light);
    border: 1px solid var(--border);
    color: var(--white);
    width: 32px; height: 32px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 1rem;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
  }
  .nav-arrow:hover { background: var(--gold); border-color: var(--gold); color: var(--navy-dark); }

  .btn-primary {
    background: var(--gold);
    color: var(--navy-dark) !important;
    border: none;
    color: var(--white);
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 0.85rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 8px 18px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex; align-items: center; gap: 6px;
  }
  .btn-primary:hover { background: var(--gold-dark); transform: translateY(-1px); }

  .btn-secondary {
    background: var(--panel-light);
    border: 1px solid var(--border);
    color: var(--white);
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 0.85rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 8px 18px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex; align-items: center; gap: 6px;
  }
  .btn-secondary:hover { background: var(--panel); border-color: var(--grass); }

  /* Calendar Grid */
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 2px;
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }
  .cal-day-header {
    background: var(--panel);
    padding: 8px 4px;
    text-align: center;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 0.72rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-dim);
  }
  .cal-day {
    background: var(--panel-light);
    min-height: 110px;
    padding: 6px;
    cursor: pointer;
    transition: background 0.15s;
    position: relative;
  }
  .cal-day:hover { background: #1a2d5a; }
  .cal-day.other-month { background: #111e17; opacity: 0.5; }
  .cal-day.today { outline: 2px solid var(--gold); outline-offset: -2px; }
  .cal-day.weekend { background: #0f1e45; }
  .cal-day.weekend:hover { background: #162248; }
  .cal-day-num {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 0.9rem;
    color: var(--text-dim);
    margin-bottom: 4px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .cal-day-num .today-dot {
    width: 18px; height: 18px;
    background: var(--gold);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: var(--navy-dark);
    font-size: 0.7rem;
    font-weight: 900;
  }
  .cal-day-add {
    position: absolute; bottom: 4px; right: 4px;
    width: 18px; height: 18px;
    background: var(--grass);
    border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.8rem;
    opacity: 0;
    transition: opacity 0.2s;
    cursor: pointer;
    color: white;
  }
  .cal-day:hover .cal-day-add { opacity: 1; }

  /* Events on calendar */
  .cal-events { display: flex; flex-direction: column; gap: 2px; }
  .cal-event {
    font-size: 0.68rem;
    font-weight: 600;
    padding: 2px 5px;
    border-radius: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    cursor: pointer;
    transition: opacity 0.15s;
    line-height: 1.4;
  }
  .cal-event:hover { opacity: 0.8; }
  .cal-event.type-game { border-left: 3px solid currentColor; }
  .cal-event.type-coach { border-left: 3px solid #f472b6; background: rgba(244,114,182,0.15); color: #f472b6; }

  .ev-u67   { color: #f7c844; background: rgba(247,200,68,0.15); }
  .ev-u89   { color: #4dc8f0; background: rgba(77,200,240,0.15); }
  .ev-u1011 { color: #a78bfa; background: rgba(167,139,250,0.15); }
  .ev-u1213 { color: #f97316; background: rgba(249,115,22,0.15); }
  .ev-u14   { color: #34d399; background: rgba(52,211,153,0.15); }

  /* Admin / ops event types */
  .cal-event.type-admin   { border-left: 3px solid #38bdf8; background: rgba(56,189,248,0.13); color: #38bdf8; }
  .cal-event.type-meeting { border-left: 3px solid #a3e635; background: rgba(163,230,53,0.12); color: #a3e635; }
  .cal-event.type-tryout  { border-left: 3px solid #fb923c; background: rgba(251,146,60,0.13); color: #fb923c; }
  .cal-event.type-holiday { border-left: 3px solid #fbbf24; background: rgba(251,191,36,0.18); color: #fbbf24; font-style: italic; }

  .more-events {
    font-size: 0.65rem;
    color: var(--text-dim);
    padding: 1px 4px;
    cursor: pointer;
  }

  /* LIST VIEW */
  .list-view { display: flex; flex-direction: column; gap: 8px; }
  .list-week {
    margin-bottom: 4px;
  }
  .list-week-header {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 0.72rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-dim);
    padding: 8px 0 4px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 6px;
  }
  .list-event {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--panel-light);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    transition: all 0.2s;
    cursor: pointer;
  }
  .list-event:hover { border-color: var(--grass); background: #1e3d28; }
  .list-event-date {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 0.75rem;
    color: var(--text-dim);
    min-width: 70px;
  }
  .list-event-color { width: 4px; height: 36px; border-radius: 2px; flex-shrink: 0; }
  .list-event-info { flex: 1; }
  .list-event-title { font-weight: 600; font-size: 0.88rem; margin-bottom: 2px; }
  .list-event-meta { font-size: 0.75rem; color: var(--text-dim); }
  .list-event-actions { display: flex; gap: 6px; opacity: 0; transition: opacity 0.2s; }
  .list-event:hover .list-event-actions { opacity: 1; }
  .icon-btn {
    background: none; border: none;
    color: var(--text-dim); cursor: pointer;
    font-size: 0.8rem; padding: 4px 6px;
    border-radius: 4px; transition: all 0.2s;
  }
  .icon-btn:hover { color: var(--white); background: var(--border); }
  .icon-btn.del:hover { color: var(--red); }

  /* MODAL */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.75);
    z-index: 200;
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(4px);
    animation: fadeIn 0.15s;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .modal {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px;
    width: 100%;
    max-width: 500px;
    box-shadow: var(--shadow);
    animation: slideUp 0.2s;
    max-height: 90vh;
    overflow-y: auto;
  }
  @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

  .modal h2 {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800;
    font-size: 1.4rem;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin-bottom: 20px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .modal-close {
    background: none; border: none;
    color: var(--text-dim); cursor: pointer;
    font-size: 1.2rem; line-height: 1;
    padding: 2px 6px; border-radius: 4px;
    transition: color 0.2s;
  }
  .modal-close:hover { color: var(--white); }

  .form-group { margin-bottom: 16px; }
  .form-group label {
    display: block;
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 6px;
  }
  .form-group input,
  .form-group select,
  .form-group textarea {
    width: 100%;
    background: var(--panel-light);
    border: 1px solid var(--border);
    color: var(--white);
    font-family: 'Barlow', sans-serif;
    font-size: 0.9rem;
    padding: 10px 12px;
    border-radius: 8px;
    outline: none;
    transition: border-color 0.2s;
  }
  .form-group input:focus,
  .form-group select:focus,
  .form-group textarea:focus { border-color: var(--grass); }
  .form-group select option { background: var(--panel); }
  .form-group textarea { resize: vertical; min-height: 70px; }

  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .event-type-tabs {
    display: flex; gap: 6px; margin-bottom: 20px;
  }
  .type-tab {
    flex: 1;
    padding: 8px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel-light);
    color: var(--text-dim);
    cursor: pointer;
    text-align: center;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 0.8rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    transition: all 0.2s;
  }
  .type-tab.active.game { background: rgba(26,122,60,0.3); border-color: var(--grass); color: var(--grass-light); }
  .type-tab.active.coach { background: rgba(244,114,182,0.2); border-color: #f472b6; color: #f472b6; }

  .modal-actions { display: flex; gap: 10px; margin-top: 24px; justify-content: flex-end; }

  /* SETUP VIEW */
  .setup-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }
  .setup-card {
    background: var(--panel-light);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
  }
  .setup-card h3 {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800;
    font-size: 1.1rem;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin-bottom: 14px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .setup-table { width: 100%; border-collapse: collapse; }
  .setup-table th {
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-dim);
    text-align: left;
    padding: 6px 8px;
    border-bottom: 1px solid var(--border);
  }
  .setup-table td {
    padding: 8px;
    font-size: 0.83rem;
    border-bottom: 1px solid rgba(42,80,56,0.3);
    vertical-align: middle;
  }
  .setup-table tr:last-child td { border-bottom: none; }
  .setup-table input, .setup-table select {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--white);
    font-family: 'Barlow', sans-serif;
    font-size: 0.82rem;
    padding: 5px 8px;
    border-radius: 6px;
    outline: none;
    width: 100%;
  }
  .setup-table input:focus, .setup-table select:focus { border-color: var(--grass); }

  .tag {
    display: inline-flex; align-items: center;
    padding: 2px 8px;
    border-radius: 4px;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 0.7rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .tag-game { background: rgba(26,122,60,0.3); color: var(--grass-light); border: 1px solid var(--grass-dark); }
  .tag-coach { background: rgba(244,114,182,0.2); color: #f472b6; border: 1px solid rgba(244,114,182,0.3); }

  /* STATS BAR */
  .stats-bar {
    display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap;
  }
  .stat-card {
    background: var(--panel-light);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
    display: flex; align-items: center; gap: 10px;
  }
  .stat-icon {
    width: 36px; height: 36px;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.1rem;
  }
  .stat-info { display: flex; flex-direction: column; }
  .stat-num {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800;
    font-size: 1.4rem;
    line-height: 1;
  }
  .stat-label { font-size: 0.7rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.06em; }

  /* View toggle */
  .view-toggle {
    display: flex; gap: 4px;
    background: var(--panel-light);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 3px;
  }
  .view-btn {
    background: none; border: none;
    color: var(--text-dim);
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 0.75rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 5px 12px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .view-btn.active { background: var(--gold); color: var(--navy-dark); font-weight: 800; }

  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-dim);
    font-size: 0.9rem;
  }
  .empty-state .emoji { font-size: 2rem; margin-bottom: 10px; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: var(--pitch); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--grass-dark); }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 24px; right: 24px;
    background: var(--gold);
    color: white;
    padding: 12px 20px;
    border-radius: 10px;
    font-weight: 600;
    font-size: 0.875rem;
    color: var(--navy-dark);
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    z-index: 999;
    animation: toastIn 0.3s, toastOut 0.3s 2.5s forwards;
  }
  @keyframes toastIn { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  @keyframes toastOut { to { transform: translateY(20px); opacity: 0; } }

  .del-btn {
    background: none; border: none;
    color: var(--text-dim); cursor: pointer;
    font-size: 0.8rem; padding: 3px 6px;
    border-radius: 4px; transition: all 0.2s;
  }
  .del-btn:hover { color: var(--red); background: rgba(214,48,48,0.1); }

  /* Field permit tags */
  .permit-tag {
    display: inline-block;
    font-size: 0.68rem;
    padding: 1px 6px;
    border-radius: 3px;
    margin: 1px 2px 1px 0;
  }
  .permit-sat { background: rgba(240,180,41,0.2); color: var(--gold); }
  .permit-sun { background: rgba(58,155,213,0.2); color: var(--sky); }
  .permit-fri { background: rgba(167,139,250,0.2); color: #a78bfa; }

  @media (max-width: 900px) {
    .sidebar { display: none; }
    .setup-grid { grid-template-columns: 1fr; }
  }
</style>
</head>

<!-- ADD EVENT MODAL -->
<div class="modal-overlay" id="event-modal" style="display:none">
  <div class="modal">
    <h2>
      <span id="modal-title">Add Event</span>
      <button class="modal-close" onclick="closeModal('event-modal')">✕</button>
    </h2>
    <div class="event-type-tabs">
      <div class="type-tab game active" id="tab-game" onclick="setEventType('game')">⚽ Game</div>
      <div class="type-tab coach" id="tab-coach" onclick="setEventType('coach')">📋 Coach Ed</div>
    </div>
    <div id="game-fields">
      <div class="form-row">
        <div class="form-group">
          <label>Date</label>
          <input type="date" id="ev-date">
        </div>
        <div class="form-group">
          <label>Time</label>
          <input type="time" id="ev-time">
        </div>
      </div>
      <div class="form-group">
        <label>Age Group</label>
        <select id="ev-age">
          <option value="">Select age group...</option>
        </select>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Home Team</label>
          <input type="text" id="ev-home" placeholder="Team name">
        </div>
        <div class="form-group">
          <label>Away Team</label>
          <input type="text" id="ev-away" placeholder="Team name or Opponent">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Field</label>
          <select id="ev-field">
            <option value="">Select field...</option>
          </select>
        </div>
        <div class="form-group">
          <label>Level / Division</label>
          <input type="text" id="ev-level" placeholder="e.g. Competitive, Rec">
        </div>
      </div>
      <div class="form-group">
        <label>Notes</label>
        <textarea id="ev-notes" placeholder="Referee info, special instructions..."></textarea>
      </div>
    </div>
    <div id="coach-fields" style="display:none">
      <div class="form-row">
        <div class="form-group">
          <label>Date</label>
          <input type="date" id="ce-date">
        </div>
        <div class="form-group">
          <label>Time</label>
          <input type="time" id="ce-time" value="18:30">
        </div>
      </div>
      <div class="form-group">
        <label>Format / Age Group Target</label>
        <select id="ce-format">
          <option value="7v7">7v7 Coaches (U6/U7/U8)</option>
          <option value="9v9">9v9 Coaches (U9/U10/U11)</option>
          <option value="11v11">11v11 Coaches (U12+)</option>
          <option value="all">All Coaches</option>
        </select>
      </div>
      <div class="form-group">
        <label>Session Topic</label>
        <input type="text" id="ce-topic" placeholder="e.g. Rondo Possession, Pressing, GK Development">
      </div>
      <div class="form-group">
        <label>Location / Venue</label>
        <input type="text" id="ce-location" placeholder="Clubhouse, Field 1, Zoom...">
      </div>
      <div class="form-group">
        <label>Presenter / Instructor</label>
        <input type="text" id="ce-presenter" placeholder="Name or TBD">
      </div>
      <div class="form-group">
        <label>Notes</label>
        <textarea id="ce-notes" placeholder="Materials, prerequisites, registration info..."></textarea>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeModal('event-modal')">Cancel</button>
      <button class="btn-primary" onclick="saveEvent()">💾 Save Event</button>
    </div>
  </div>
</div>

<!-- FIELD MODAL -->
<div class="modal-overlay" id="field-modal" style="display:none">
  <div class="modal">
    <h2>
      <span id="field-modal-title">Add Field</span>
      <button class="modal-close" onclick="closeModal('field-modal')">✕</button>
    </h2>
    <div class="form-group">
      <label>Field Name</label>
      <input type="text" id="fm-name" placeholder="e.g. Field 1 - North">
    </div>
    <div class="form-group">
      <label>Permit Days</label>
      <div style="display:flex;gap:10px;margin-top:4px">
        <label style="display:flex;align-items:center;gap:6px;font-size:0.85rem;text-transform:none;letter-spacing:0;cursor:pointer">
          <input type="checkbox" id="fm-fri" style="width:auto"> Fri
        </label>
        <label style="display:flex;align-items:center;gap:6px;font-size:0.85rem;text-transform:none;letter-spacing:0;cursor:pointer">
          <input type="checkbox" id="fm-sat" style="width:auto"> Sat
        </label>
        <label style="display:flex;align-items:center;gap:6px;font-size:0.85rem;text-transform:none;letter-spacing:0;cursor:pointer">
          <input type="checkbox" id="fm-sun" style="width:auto"> Sun
        </label>
      </div>
    </div>
    <div class="form-group">
      <label>Permit Window (Sat)</label>
      <input type="text" id="fm-sat-window" placeholder="e.g. 8:00am – 5:00pm">
    </div>

const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

function fmt(date) {
  const d = new Date(date + 'T00:00:00');
  return d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
}

function fmtTime(t) {
  if (!t) return '';
  const [h, m] = t.split(':');
  const hr = parseInt(h);
  const ampm = hr >= 12 ? 'pm' : 'am';
  return `${hr % 12 || 12}:${m}${ampm}`;
}

function getAgeGroup(id) { return state.ageGroups.find(a => a.id === id); }
function getField(id) { return state.fields.find(f => f.id === id); }

function genId() { return Math.random().toString(36).slice(2, 9); }

function showToast(msg) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

function renderMonthGrid() {
  const body = document.getElementById('cal-body');
  const year = state.currentYear;
  const month = state.currentMonth;
  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const today = new Date();

  let html = '<div class="cal-grid">';
  DAYS.forEach(d => html += `<div class="cal-day-header">${d}</div>`);

  // Pre-fill blanks
  for (let i = 0; i < firstDay; i++) {
    const prevDate = new Date(year, month, -firstDay + i + 1);
    html += `<div class="cal-day other-month"><div class="cal-day-num">${prevDate.getDate()}</div></div>`;
  }

  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dow = new Date(year, month, d).getDay();
    const isWeekend = dow === 0 || dow === 5 || dow === 6;
    const isToday = today.getFullYear() === year && today.getMonth() === month && today.getDate() === d;

    const dayEvents = state.events.filter(e => {
      if (e.date !== dateStr) return false;
      if (state.filterAgeGroup !== 'all' && e.type === 'game' && e.ageId !== state.filterAgeGroup) return false;
      return true;
    });

    const maxShow = 3;
    const evHtml = dayEvents.slice(0, maxShow).map(e => {
      if (e.type === 'coach') {
        const fmt = e.format === 'all' ? 'All' : e.format;
        return `<div class="cal-event type-coach" onclick="editEvent('${e.id}',event)" title="${e.topic}">${fmtTime(e.time)} ${fmt}: ${e.topic}</div>`;
      }
      if (e.type === 'gameday') {
        const fmtLabels = e.formats ? e.formats.join(' · ') : 'All formats';
        return `<div class="cal-event type-game" style="border-left:3px solid var(--gold);background:rgba(240,180,41,0.13);color:var(--gold)" onclick="editEvent('${e.id}',event)" title="${e.label}">⚽ ${e.label}</div>`;
      }
      if (e.type === 'admin') {
        const t = e.time ? fmtTime(e.time) + ' ' : '';
        return `<div class="cal-event type-admin" onclick="editEvent('${e.id}',event)" title="${e.label}">${t}${e.label}</div>`;
      }
      if (e.type === 'meeting') {
        const t = e.time ? fmtTime(e.time) + ' ' : '';
        return `<div class="cal-event type-meeting" onclick="editEvent('${e.id}',event)" title="${e.label}">${t}${e.label}</div>`;
      }
      if (e.type === 'tryout') {
        return `<div class="cal-event type-tryout" onclick="editEvent('${e.id}',event)" title="${e.label}">⚡ ${e.label}</div>`;
      }
      if (e.type === 'holiday') {
        return `<div class="cal-event type-holiday" onclick="editEvent('${e.id}',event)" title="${e.label}">🏛 ${e.label}</div>`;
      }
      const ag = getAgeGroup(e.ageId);
      if (!ag) return '';
      return `<div class="cal-event type-game ev-${e.ageId}" onclick="editEvent('${e.id}',event)" title="${e.home} vs ${e.away}">${fmtTime(e.time)} ${ag.label}: ${e.home} v ${e.away}</div>`;
    }).join('');
    const more = dayEvents.length > maxShow ? `<div class="more-events">+${dayEvents.length - maxShow} more</div>` : '';

    html += `
      <div class="cal-day ${isWeekend?'weekend':''} ${isToday?'today':''}" >
        <div class="cal-day-num">
          ${isToday ? `<div class="today-dot">${d}</div>` : d}
        </div>
        <div class="cal-events">${evHtml}${more}</div>
        <div class="cal-day-add" onclick="openEventModal('${dateStr}')">+</div>
      </div>`;
  }

  // Fill remaining
  const totalCells = firstDay + daysInMonth;
  const remainder = totalCells % 7 === 0 ? 0 : 7 - (totalCells % 7);
  for (let i = 1; i <= remainder; i++) {
    html += `<div class="cal-day other-month"><div class="cal-day-num">${i}</div></div>`;
  }

  html += '</div>';
  body.innerHTML = html;
}

function renderWeekList() {
  // Show all weeks in current month
  const year = state.currentYear;
  const month = state.currentMonth;
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  let html = '<div class="list-view">';

  let weekEvents = [];
  let weekStart = null;

  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dow = new Date(year, month, d).getDay();

    if (dow === 0 || d === 1) {
      if (weekStart !== null && weekEvents.length > 0) {
        html += renderWeekBlock(weekStart, weekEvents);
      }
      weekStart = dateStr;
      weekEvents = [];
    }

    const dayEvents = state.events.filter(e => {
      if (e.date !== dateStr) return false;
      if (state.filterAgeGroup !== 'all' && e.type === 'game' && e.ageId !== state.filterAgeGroup) return false;
      return true;
    });
    dayEvents.forEach(e => weekEvents.push(e));
  }
  if (weekEvents.length > 0) html += renderWeekBlock(weekStart, weekEvents);
  html += '</div>';
  document.getElementById('cal-body').innerHTML = html;
}

      } else if (e.type === 'tryout') {
        html += `
          <div class="list-event">
            <div class="list-event-date">${fmt(e.date)}<br>${fmtTime(e.time)}</div>
            <div class="list-event-color" style="background:#fb923c"></div>

            <span class="tag" style="background:rgba(251,146,60,0.15);color:#fb923c">Tryouts</span>
          </div>`;
      } else if (e.type === 'holiday') {
        html += `
          <div class="list-event">
            <div class="list-event-date">${fmt(e.date)}</div>
            <div class="list-event-color" style="background:#fbbf24"></div>
            <div class="list-event-info">

            </div>
            <span class="tag" style="background:rgba(251,191,36,0.18);color:#fbbf24">Holiday</span>
          </div>`;
      } else if (e.type === 'gameday') {
        const fmtBadges = (e.formats||[]).map(f => `<span class="tag tag-game" style="margin-right:4px">${f}</span>`).join('');
        html += `
          <div class="list-event">
            <div class="list-event-date">${fmt(e.date)}<br><span style="color:var(--gold);font-weight:700">Game Day</span></div>
            <div class="list-event-color" style="background:var(--gold)"></div>
            <div class="list-event-info">
              <div class="list-event-title">⚽ ${e.label}</div>
              <div style="margin-top:4px">${fmtBadges}</div>
              ${e.notes ? `<div style="margin-top:4px;font-size:0.78rem;color:var(--text-dim)">${e.notes}</div>` : ''}
            </div>
          </div>`;
      } else {
        const ag = getAgeGroup(e.ageId);
        const fi = getField(e.fieldId);
        html += `
          <div class="list-event" onclick="editEvent('${e.id}',event)">
            <div class="list-event-date">${fmt(e.date)}<br>${fmtTime(e.time)}</div>
            <div class="list-event-color" style="background:${ag?.color||'#888'}"></div>
            <div class="list-event-info">
              <div class="list-event-title">⚽ ${e.home} <span style="color:var(--text-dim)">vs</span> ${e.away}</div>
              <div class="list-event-meta">${ag?.label||''} · ${ag?.format||''} · ${fi?.name||'No field'} · ${e.level||''}</div>
            </div>
            <span class="tag tag-game">${ag?.label||''}</span>
            <div class="list-event-actions">
              <button class="icon-btn del" onclick="deleteEvent('${e.id}',event)">🗑</button>
            </div>
          </div>`;
      }
    });
    html += '</div>';
  });
  html += '</div>';
  content.innerHTML = html;
}

function renderSetup() {

  const ageRows = state.ageGroups.map(a => `

      <td><span style="color:${a.color};font-weight:700">${a.label}</span></td>
      <td>
        <select onchange="updateAge('${a.id}','format',this.value)">
          <option value="7v7" ${a.format==='7v7'?'selected':''}>7v7</option>
          <option value="9v9" ${a.format==='9v9'?'selected':''}>9v9</option>
          <option value="11v11" ${a.format==='11v11'?'selected':''}>11v11</option>
        </select>
      </td>
      <td>
        <input type="text" value="${a.teams.join(', ')}" placeholder="Team 1, Team 2..."
          onchange="updateAge('${a.id}','teams',this.value)" style="min-width:180px">
      </td>
    </tr>
  `).join('');

  const fieldRows = state.fields.map(f => `

      <td><input type="text" value="${f.name}" onchange="updateField('${f.id}','name',this.value)"></td>

      <td><input type="text" value="${f.friWindow}" placeholder="5pm–9pm" onchange="updateField('${f.id}','friWindow',this.value)"></td>
      <td>
        <select onchange="updateField('${f.id}','size',this.value)">
          <option value="7v7" ${f.size==='7v7'?'selected':''}>7v7</option>
          <option value="9v9" ${f.size==='9v9'?'selected':''}>9v9</option>
          <option value="11v11" ${f.size==='11v11'?'selected':''}>11v11</option>
          <option value="multi" ${f.size==='multi'?'selected':''}>Multi</option>
        </select>
      </td>
      <td><button class="del-btn" onclick="deleteField('${f.id}')">🗑</button></td>
    </tr>
  `).join('');

  content.innerHTML = `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px">
      <h2 style="font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:1.8rem;letter-spacing:0.04em;text-transform:uppercase">

        <p style="font-size:0.78rem;color:var(--text-dim);margin-bottom:12px">Set the game format and team names for each age group. Teams entered here appear in game dropdowns.</p>

// ============================================================
function prevMonth() {
  if (state.currentMonth === 0) { state.currentMonth = 11; state.currentYear--; }
  else state.currentMonth--;
  render();
}
function nextMonth() {
  if (state.currentMonth === 11) { state.currentMonth = 0; state.currentYear++; }
  else state.currentMonth++;
  render();
}
function setCalView(v) {
  state.calView = v;
  render();
}

function setEventType(t) {
  state.eventType = t;
  document.getElementById('game-fields').style.display = t === 'game' ? 'block' : 'none';
  document.getElementById('coach-fields').style.display = t === 'coach' ? 'block' : 'none';
  document.getElementById('tab-game').classList.toggle('active', t === 'game');
  document.getElementById('tab-coach').classList.toggle('active', t === 'coach');
}

function saveEvent() {
  const isCoach = state.eventType === 'coach';
  let ev;

  if (isCoach) {
    const date = document.getElementById('ce-date').value;
    if (!date) { alert('Please enter a date.'); return; }
    ev = {
      id: state.editingEventId || genId(),
      type: 'coach',
      date,
      time: document.getElementById('ce-time').value,
      format: document.getElementById('ce-format').value,
      topic: document.getElementById('ce-topic').value || 'TBD',
      location: document.getElementById('ce-location').value,
      presenter: document.getElementById('ce-presenter').value,
      notes: document.getElementById('ce-notes').value,
    };
  } else {
    const date = document.getElementById('ev-date').value;
    const ageId = document.getElementById('ev-age').value;
    if (!date || !ageId) { alert('Please enter a date and age group.'); return; }
    ev = {
      id: state.editingEventId || genId(),
      type: 'game',
      date,
      time: document.getElementById('ev-time').value,
      ageId,
      home: document.getElementById('ev-home').value || 'Home',
      away: document.getElementById('ev-away').value || 'Away',
      fieldId: document.getElementById('ev-field').value,
      level: document.getElementById('ev-level').value,
      notes: document.getElementById('ev-notes').value,
    };
  }

  if (state.editingEventId) {
    const idx = state.events.findIndex(x => x.id === state.editingEventId);
    if (idx >= 0) state.events[idx] = ev;
    showToast('Event updated ✓');
  } else {
    state.events.push(ev);
    showToast('Event added ✓');
  }

  closeModal('event-modal');
  render();
}

function deleteEvent(id, e) {
  if (e) e.stopPropagation();
  if (!confirm('Delete this event?')) return;
  state.events = state.events.filter(x => x.id !== id);
  showToast('Event deleted');
  render();
}

// ============================================================
function openFieldModal(fieldId) {
  state.editingFieldId = fieldId || null;
  if (fieldId) {
    const f = getField(fieldId);
    document.getElementById('fm-name').value = f.name;
    document.getElementById('fm-sat').checked = f.days.includes('sat');
    document.getElementById('fm-sun').checked = f.days.includes('sun');
    document.getElementById('fm-fri').checked = f.days.includes('fri');
    document.getElementById('fm-sat-window').value = f.satWindow;
    document.getElementById('fm-sun-window').value = f.sunWindow;
    document.getElementById('fm-fri-window').value = f.friWindow;
    document.getElementById('fm-size').value = f.size;
    document.getElementById('fm-notes').value = f.notes;
    document.getElementById('field-modal-title').textContent = 'Edit Field';
  } else {
    document.getElementById('fm-name').value = '';
    document.getElementById('fm-sat').checked = true;
    document.getElementById('fm-sun').checked = true;
    document.getElementById('fm-fri').checked = false;
    document.getElementById('fm-sat-window').value = '';
    document.getElementById('fm-sun-window').value = '';
    document.getElementById('fm-fri-window').value = '';
    document.getElementById('fm-size').value = 'multi';
    document.getElementById('fm-notes').value = '';
    document.getElementById('field-modal-title').textContent = 'Add Field';
  }
  document.getElementById('field-modal').style.display = 'flex';
}

function saveField() {
  const name = document.getElementById('fm-name').value.trim();
  if (!name) { alert('Field name required.'); return; }
  const days = [];
  if (document.getElementById('fm-fri').checked) days.push('fri');
  if (document.getElementById('fm-sat').checked) days.push('sat');
  if (document.getElementById('fm-sun').checked) days.push('sun');
  const f = {
    id: state.editingFieldId || genId(),
    name,
    days,
    satWindow: document.getElementById('fm-sat-window').value,
    sunWindow: document.getElementById('fm-sun-window').value,
    friWindow: document.getElementById('fm-fri-window').value,
    size: document.getElementById('fm-size').value,
    notes: document.getElementById('fm-notes').value,
  };
  if (state.editingFieldId) {
    const idx = state.fields.findIndex(x => x.id === state.editingFieldId);
    if (idx >= 0) state.fields[idx] = f;
    showToast('Field updated ✓');
  } else {
    state.fields.push(f);
    showToast('Field added ✓');
  }
  closeModal('field-modal');
  render();
}

function deleteField(id) {
  if (!confirm('Delete this field?')) return;
  state.fields = state.fields.filter(x => x.id !== id);
  showToast('Field deleted');
  render();
}

// ============================================================
// SETUP HELPERS
// ============================================================
function updateAge(id, key, val) {
  const a = state.ageGroups.find(x => x.id === id);
  if (!a) return;
  if (key === 'teams') {
    a.teams = val.split(',').map(t => t.trim()).filter(Boolean);
  } else {
    a[key] = val;
  }
}

function updateField(id, key, val) {
  const f = state.fields.find(x => x.id === id);
  if (f) f[key] = val;
}

// ============================================================
// MODAL CLOSE
// ============================================================
function closeModal(id) {
  document.getElementById(id).style.display = 'none';
  state.editingEventId = null;
  state.editingFieldId = null;
}

// Close modal on overlay click
document.querySelectorAll('.modal-overlay').forEach(overlay => {
  overlay.addEventListener('click', function(e) {
    if (e.target === this) {
      this.style.display = 'none';
      state.editingEventId = null;
      state.editingFieldId = null;
    }
  });
});

// ============================================================
// PERSISTENCE — localStorage auto-save / load
// ============================================================
const STORAGE_KEY = 'soccer_program_calendar_v1';

function saveToStorage() {
  try {
    const toSave = {
      events: state.events,
      fields: state.fields,
      ageGroups: state.ageGroups,
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(toSave));
  } catch(e) {
    console.warn('Could not save to localStorage:', e);
  }
}

function loadFromStorage() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return false;
    const saved = JSON.parse(raw);
    if (saved.events)    state.events    = saved.events;
    if (saved.fields)    state.fields    = saved.fields;
    if (saved.ageGroups) state.ageGroups = saved.ageGroups;
    return true;
  } catch(e) {
    console.warn('Could not load from localStorage:', e);
    return false;
  }
}

// Patch all mutating functions to auto-save after every change
const _origSaveEvent = saveEvent;
saveEvent = function() {
  _origSaveEvent();
  saveToStorage();
};

const _origDeleteEvent = deleteEvent;
deleteEvent = function(id, e) {
  _origDeleteEvent(id, e);
  saveToStorage();
};

const _origSaveField = saveField;
saveField = function() {
  _origSaveField();
  saveToStorage();
};

const _origDeleteField = deleteField;
deleteField = function(id) {
  _origDeleteField(id);
  saveToStorage();
};

const _origUpdateAge = updateAge;
updateAge = function(id, key, val) {
  _origUpdateAge(id, key, val);
  saveToStorage();
};

const _origUpdateField = updateField;
updateField = function(id, key, val) {
  _origUpdateField(id, key, val);
  saveToStorage();
};

// ============================================================
// EXPORT / IMPORT BACKUP
// ============================================================
function exportData() {
  const data = JSON.stringify({ events: state.events, fields: state.fields, ageGroups: state.ageGroups }, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'soccer-calendar-backup.json';
  a.click();
  URL.revokeObjectURL(url);
  showToast('Backup downloaded ✓');
}

function importData(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      if (data.events)    state.events    = data.events;
      if (data.fields)    state.fields    = data.fields;
      if (data.ageGroups) state.ageGroups = data.ageGroups;
      saveToStorage();
      render();
      showToast('Backup restored ✓');
    } catch(err) {
      alert('Invalid backup file.');
    }
  };
  reader.readAsText(file);
}

// ============================================================
// INIT
// ============================================================
// Version stamp — if the stored version doesn't match, clear stale data
// so the new real program data loads fresh. Bump this string any time
// you do a full data refresh.
const DATA_VERSION = 'v14-coachzoom';
const storedVersion = localStorage.getItem(STORAGE_KEY + '_version');

if (storedVersion !== DATA_VERSION) {
  // Clear old data so fresh real-program seed loads
  localStorage.removeItem(STORAGE_KEY);
  localStorage.setItem(STORAGE_KEY + '_version', DATA_VERSION);
  setTimeout(() => showToast('✓ Program data loaded — auto-save is ON'), 400);
  render();
} else {
  const hadSavedData = loadFromStorage();
  if (hadSavedData) {
    setTimeout(() => showToast('✓ Your calendar data has been restored'), 300);
  }
  render();
}
</script>
</body>
</html>
